<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Warm clay background with rounded corners -->
  <rect width="32" height="32" rx="7" fill="#C8A882"/>
  <!-- Subtle gradient overlay -->
  <rect width="32" height="32" rx="7" fill="url(#g)" opacity="0.3"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <!-- AI text small, BP text large -->
  <text x="5" y="13" font-family="Arial,sans-serif" font-size="7" font-weight="700"
    fill="white" opacity="0.85" letter-spacing="0.5">AI</text>
  <text x="16" y="26" font-family="Arial,sans-serif" font-size="16" font-weight="800"
    text-anchor="middle" fill="white" letter-spacing="-1">BP</text>
</svg>
